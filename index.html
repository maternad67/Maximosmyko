<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAXIMO SMYKO</title>
    
    <link rel="icon" type="image/png" href="korunka.png">
    
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="header">
        <img src="korunka.png" alt="MAXIMOSMYKO">
        <h1>MAXIMO SMYKO</h1> 
    </div>

    <div id="setup">
        <h2>Nastavení hry</h2>
        
        <div id="setup-form">
            
            <!-- 1. Počet hráčů v týmu -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; background: #1f1f1f; padding: 15px; border-radius: 8px; border: 1px solid #333;">
                <label for="team-size-input" style="font-size: 15px; margin: 0; color: #fff;">Počet hráčů v týmu pro ruletu:</label>
                <input type="number" id="team-size-input" value="2" min="1" style="background: #111; color: white; border: 1px solid #dfb331; border-radius: 4px; padding: 8px; width: 60px; text-align: center; outline: none; font-weight: bold;">
            </div>

            <!-- 2. Políčka pro jména hráčů -->
            <label style="display: block; margin-bottom: 10px; color: #ccc; font-size: 14px; text-align: center;">Jména hráčů:</label>
            <div id="player-names-container" style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px;">
                <!-- Vygeneruje se přes JS -->
            </div>
            
            <!-- 3. Tlačítko pro přidání dalšího hráče -->
            <button type="button" id="add-player-btn" style="background: transparent; color: #dfb331; border: 1px dashed #dfb331; border-radius: 6px; padding: 12px; font-size: 14px; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 30px; transition: background 0.2s;">
                + PŘIDAT DALŠÍHO HRÁČE
            </button>

            <!-- 4. Přepínač režimu -->
            <div class="mode-switch" style="margin-bottom: 30px; background: #1a1a1a; padding: 15px; border-radius: 8px; border: 1px solid #333; display: flex; justify-content: space-between; align-items: center;">
                <span style="color: #ccc; font-weight: bold;">DĚTSKÝ / TÁBOROVÝ REŽIM 🏕️</span>
                <label class="switch" style="margin: 0;">
                    <input type="checkbox" id="camp-mode-toggle">
                    <span class="slider"></span>
                </label>
            </div>
            
            <!-- 5. Tlačítko Rozlosovat týmy (NAPEVNO OBEJITÁ MEZIPAMĚŤ) -->
            <button type="button" onclick="
                let names = [];
                document.querySelectorAll('#player-names-container input').forEach(inp => {
                    if(inp.value.trim() !== '') names.push(inp.value.trim());
                });
                if(names.length < 2) {
                    alert('Pro ruletu musíte vyplnit alespoň 2 hráče!');
                    return;
                }
                
                /* Přímé ukládání do trvalé paměti bez spoléhání na starý script.js */
                localStorage.setItem('maximo_roulette_names', JSON.stringify(names));
                localStorage.setItem('maximo_roulette_size', document.getElementById('team-size-input').value);
                
                let toggle = document.getElementById('camp-mode-toggle');
                localStorage.setItem('maximo_camp_mode', toggle ? toggle.checked : false);
                
                /* Přesměrování s kódem navíc, aby se nenačetla stará ruleta */
                window.location.href = 'ruleta.html?t=' + new Date().getTime();
            " style="display: block; background: #2a7a7c; color: white; border: none; padding: 15px; font-size: 16px; font-weight: bold; border-radius: 8px; text-align: center; width: 100%; margin-bottom: 15px; box-sizing: border-box; cursor: pointer; transition: opacity 0.2s;">
                🎲 ROZLOSOVAT TÝMY
            </button>

            <!-- 6. Tlačítko HRÁT JAKO JEDNOTLIVCI -->
            <button type="button" onclick="window.startGame(event)" style="display: block; background: #dfb331; color: #222; border: none; padding: 15px; font-size: 16px; font-weight: bold; border-radius: 8px; text-align: center; width: 100%; box-sizing: border-box; cursor: pointer; transition: opacity 0.2s;">
                HRÁT JAKO JEDNOTLIVCI
            </button>
        </div>
    </div>

    <!-- HERNÍ MAPA -->
    <div id="game" style="display: none;">
        <div class="game-layout">
            <div class="left-col">
                <button id="back-to-menu">Zpět do menu</button>
                <button id="restart-game">Restartovat hru</button>
                <div id="player-info"></div>
            </div>

            <div class="center-col">
                <div id="board"></div>
            </div>
            
            <div class="right-col">
                <div id="controls">
                    <div class="roll-group">
                        <button id="roll-dice">Hodit kostkou</button>
                        <input type="number" id="manual-roll" placeholder="Hod (+/-)">
                    </div>
                    <div id="turn-indicator">Připravte hru...</div>
                </div>
                <div id="task">
                    <p id="task-text"></p>
                </div>
            </div>
        </div>
    </div>

    <div id="custom-modal" class="hidden">
        <div class="modal-box">
            <h3>⚠️ Hlášení</h3>
            <p id="modal-text"></p>
            <button id="modal-btn">to je jasný</button>
        </div>
    </div>

    <!-- TRIK PROTI MEZIPAMĚTI: ?v=999 donutí prohlížeč stáhnout novou verzi tvého script.js -->
    <script src="script.js?v=3000"></script>
    
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
            .catch(err => console.error('SW chyba:', err));
        }
    </script>
</body>
</html>
