<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAXIMO SMYKO</title>
    
    <link rel="icon" type="image/png" href="korunka.png">
    
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="header">
        <img src="korunka.png" alt="MAXIMOSMYKO">
        <h1>MAXIMO SMYKO</h1> 
    </div>
       
<!-- ... zbytek tvého index.html nahoře ... -->

   <!-- ... zbytek tvého index.html nahoře ... -->

    <div id="setup">
        <h2>Nastavení hry</h2>
        <form id="setup-form">
            <label for="player-count">Počet hráčů:</label>
            <select id="player-count">
                <option value="1">1</option>
                <option value="2" selected>2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
            </select>
            <div id="player-names"></div>
            
            <div class="mode-switch">
                <span>Dětský / Táborový režim 🏕️</span>
                <label class="switch">
                    <input type="checkbox" id="camp-mode-toggle">
                    <span class="slider"></span>
                </label>
            </div>
            
            <button type="submit">START</button>
        </form>

        <!-- BLOK RULETY JE NYNÍ BEZPEČNĚ MIMO FORMULÁŘ HRY -->
        <div style="margin-top: 30px; background: #1f1f1f; padding: 15px; border-radius: 8px; border: 1px solid #333;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <label for="team-size-input" style="font-size: 14px; margin: 0; color: #fff;">Počet hráčů v týmu:</label>
                <input type="number" id="team-size-input" value="2" min="1" style="background: #111; color: white; border: 1px solid #444; border-radius: 4px; padding: 8px; width: 60px; text-align: center; outline: none;">
            </div>
            
            <!-- Toto už není formulářové tlačítko, ale chytrý odkaz -->
            <a href="#" id="go-to-roulette-link" style="display: block; background: #dfb331; color: #222; text-decoration: none; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 4px; text-align: center; width: 100%; transition: opacity 0.2s;"
               onclick="
                   event.preventDefault();
                   let names = [];
                   document.querySelectorAll('#player-names input').forEach(inp => {
                       if(inp.value.trim() !== '') names.push(inp.value.trim());
                   });
                   if(names.length < 2) {
                       alert('Pro ruletu musíte do nastavení hry vyplnit alespoň 2 jména!');
                       return;
                   }
                   sessionStorage.setItem('maximo_roulette_names', JSON.stringify(names));
                   sessionStorage.setItem('maximo_roulette_size', document.getElementById('team-size-input').value);
                   window.location.href = 'ruleta.html';
               ">
                🎲 ROZLOSOVAT TÝMY
            </a>
        </div>
    </div>

<!-- ... zbytek tvého index.html dole ... -->
<!-- ... zbytek tvého index.html dole ... -->

    <div id="game" style="display: none;">
        <div class="game-layout">
            <div class="left-col">
                <button id="back-to-menu">Zpět do menu</button>
                <button id="restart-game">Restartovat hru</button>
                <div id="player-info"></div>
            </div>

            <div class="center-col">
                <div id="board"></div>
            </div>
            
            <div class="right-col">
                <div id="controls">
                    <div class="roll-group">
                        <button id="roll-dice">Hodit kostkou</button>
                        <input type="number" id="manual-roll" placeholder="Hod (+/-)">
                    </div>
                    <div id="turn-indicator">Připravte hru...</div>
                </div>
                <div id="task">
                    <p id="task-text"></p>
                </div>
            </div>
        </div>
    </div>

    <div id="custom-modal" class="hidden">
        <div class="modal-box">
            <h3>⚠️ Hlášení</h3>
            <p id="modal-text"></p>
            <button id="modal-btn">to je jasný</button>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // REGISTRACE OFFLINE APLIKACE
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
            .catch(err => console.error('SW chyba:', err));
        }
    </script>
</body>
</html>
