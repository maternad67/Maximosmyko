<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAXIMO SMYKO</title>
    
    <link rel="icon" type="image/png" href="korunka.png">
    
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="header">
        <img src="korunka.png" alt="MAXIMOSMYKO">
        <h1>MAXIMO SMYKO</h1> 
    </div>
       
    <div id="setup">
        <h2>Nastavení hry</h2>
        <form id="setup-form">
            <label for="player-count">Počet hráčů:</label>
            <select id="player-count">
                <option value="1">1</option>
                <option value="2" selected>2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
            </select>
            <div id="player-names"></div>
            
            <!-- NOVÝ PŘEPÍNAČ REŽIMU (Posuvník) -->
            <!-- PŘEPÍNAČ REŽIMU -->
            <div class="mode-switch">
                <span>Dětský / Táborový režim 🏕️</span>
                <label class="switch">
                    <input type="checkbox" id="camp-mode-toggle">
                    <span class="slider"></span>
                </label>
            </div>
            
            <!-- PROPOJENÍ S RULETOU (Nový blok) -->
            <div style="margin: 20px 0; background: #1f1f1f; padding: 15px; border-radius: 8px; border: 1px solid #333;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <label for="team-size-input" style="font-size: 14px; margin: 0;">Počet hráčů v týmu:</label>
                    <input type="number" id="team-size-input" value="2" min="1" style="background: #111; color: white; border: 1px solid #444; border-radius: 4px; padding: 8px; width: 60px; text-align: center; outline: none;">
                </div>
                <button type="button" id="go-to-roulette" style="background: #dfb331; color: #222; border: none; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; width: 100%; transition: opacity 0.2s;">
                    🎲 ROZLOSOVAT TÝMY
                </button>
            </div>
            
            <button type="submit">START</button>
        </form>
    </div>

    <div id="game" style="display: none;">
        <div class="game-layout">
            <div class="left-col">
                <button id="back-to-menu">Zpět do menu</button>
                <button id="restart-game">Restartovat hru</button>
                <div id="player-info"></div>
            </div>

            <div class="center-col">
                <div id="board"></div>
            </div>
            
            <div class="right-col">
                <div id="controls">
                    <div class="roll-group">
                        <button id="roll-dice">Hodit kostkou</button>
                        <input type="number" id="manual-roll" placeholder="Hod (+/-)">
                    </div>
                    <div id="turn-indicator">Připravte hru...</div>
                </div>
                <div id="task">
                    <p id="task-text"></p>
                </div>
            </div>
        </div>
    </div>

    <div id="custom-modal" class="hidden">
        <div class="modal-box">
            <h3>⚠️ Hlášení</h3>
            <p id="modal-text"></p>
            <button id="modal-btn">to je jasný</button>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // REGISTRACE OFFLINE APLIKACE
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
            .catch(err => console.error('SW chyba:', err));
        }
    </script>
</body>
</html>
