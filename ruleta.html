<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Maximo smyko - Tvorba týmů</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            background-image: url('vnitrekmaximo.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: rgba(10, 20, 22, 0.95);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 2px solid rgba(212, 175, 55, 0.4);
            backdrop-filter: blur(5px);
        }

        #roulette-screen {
            margin-top: 0;
        }

        .wheel-wrapper {
            position: relative;
            margin: 0 auto 20px auto;
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            width: 100%;
            height: auto;
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.4);
            border: 6px solid #1c5253;
            background: #000;
        }

        #center-logo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20%;  
            max-width: 80px;
            height: auto;
            z-index: 5;
            filter: drop-shadow(0 0 10px rgba(0,0,0,0.8));
            pointer-events: none;
        }

        .pointer {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; 
            height: 0; 
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 35px solid #ffffff;
            z-index: 10;
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.8));
        }

        #status-text {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #ffd700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        #winner-text {
            height: 40px;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 25px;
            color: #ffffff;
            text-shadow: 0 0 15px #d4af37, 0 0 30px #f9a825;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 15px;
        }

        .primary-btn {
            background: linear-gradient(90deg, #d4af37, #f9a825);
            border: none;
            padding: 15px 40px;
            color: #111;
            font-size: 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .primary-btn:disabled {
            background: #4a4a4a;
            color: #888;
            box-shadow: none;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .secondary-btn {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #d4af37;
            padding: 15px 30px;
            color: #d4af37;
            font-size: 18px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            text-transform: uppercase;
            text-decoration: none;
        }

        #teams-display {
            margin-top: 25px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }

        .team-card {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #d4af37;
            border-radius: 12px;
            padding: 15px;
            min-width: 140px;
            flex: 1 1 40%;
            max-width: 200px;
            text-align: left;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .team-card h3 {
            margin: 0 0 10px 0;
            color: #ffd700;
            border-bottom: 2px solid #1c5253;
            padding-bottom: 8px;
            font-size: 18px;
            text-align: center;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .team-card ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .team-card li {
            margin-bottom: 6px;
            font-size: 16px;
            text-align: center;
            font-weight: 500;
        }

        #go-to-game-btn {
            display: none;
            margin: 30px auto 0 auto;
            background: linear-gradient(90deg, #2a7a7c, #3a9a9c);
            color: white;
            padding: 18px 40px;
            font-size: 22px;
        }

        @media (max-width: 500px) {
            body { padding: 10px; }
            .container { padding: 15px; }
            #status-text { font-size: 20px; }
            #winner-text { font-size: 26px; margin-bottom: 20px; }
            .primary-btn { padding: 12px 25px; font-size: 16px; }
            .secondary-btn { padding: 12px 20px; font-size: 14px; }
            .action-buttons { gap: 10px; }
            .team-card { min-width: 120px; padding: 10px; }
            .team-card h3 { font-size: 16px; }
            .team-card li { font-size: 15px; }
            #go-to-game-btn { font-size: 18px; padding: 15px 30px; }
        }
    </style>
</head>
<body>

    <div id="roulette-screen" class="container">
        <div id="status-text">Točíme pro: Tým 1</div>
        <div id="winner-text"></div>
        
        <div class="wheel-wrapper" id="wheel-container">
            <div class="pointer"></div>
            <img src="korunka.png" id="center-logo" alt="Maximo smyko">
            <canvas id="wheel" width="400" height="400"></canvas>
        </div>
        
        <div class="action-buttons" id="spin-actions">
            <a href="index.html" class="secondary-btn">Zpět</a>
            <button class="primary-btn" id="spin-btn" onclick="spin()">Zatočit</button>
        </div>

        <button id="go-to-game-btn" class="primary-btn" onclick="goToGame()">🎲 HRÁT V TÝMECH</button>

        <div id="teams-display"></div>
    </div>

    <script>
        const canvas = document.getElementById("wheel");
        const ctx = canvas.getContext("2d");
        const radius = canvas.width / 2;
        
        let remainingNames = [];
        let teamSize = 2;
        let teams = [[]];
        let currentTeamIndex = 0;
        let currentAngle = 0;
        let isSpinning = false;
        
        const colors = ["#143a3b", "#d4af37", "#1c5253", "#f9a825", "#0d2728", "#c5a030"];

        // --- NAČTENÍ DAT Z LOCAL STORAGE ---
        window.onload = function() {
            const savedNames = localStorage.getItem('maximo_roulette_names');
            const savedSize = localStorage.getItem('maximo_roulette_size');
            
            if (savedNames && savedSize) {
                remainingNames = JSON.parse(savedNames);
                teamSize = parseInt(savedSize);
                
                if (remainingNames.length < 2) {
                    alert("Nedostatek jmen pro ruletu.");
                    window.location.href = 'index.html';
                    return;
                }
                
                updateStatusText();
                renderTeamsUI();
                drawWheel();
            } else {
                alert("Data se nepodařilo načíst z hlavní stránky.");
                window.location.href = 'index.html';
            }
        };

        const secretPairs = [
            ["váša", "terka"],
            ["vaša", "terka"],
            ["david", "eliška"],
            ["david", "eliska"]
        ];

        function isHalfOfAvailablePair(name) {
            let n = name.toLowerCase();
            for (let pair of secretPairs) {
                let p1 = pair[0], p2 = pair[1];
                if (n === p1 && remainingNames.some(x => x.toLowerCase() === p2)) return true;
                if (n === p2 && remainingNames.some(x => x.toLowerCase() === p1)) return true;
            }
            return false;
        }

        function determineWinnerIndex() {
            let targetName = null;
            let currentTeam = teams[currentTeamIndex];
            let isLastSlot = (currentTeam.length === teamSize - 1);

            for (let pair of secretPairs) {
                let p1 = pair[0];
                let p2 = pair[1];

                let hasP1 = currentTeam.some(name => name.toLowerCase() === p1);
                let hasP2 = currentTeam.some(name => name.toLowerCase() === p2);
                let p1Available = remainingNames.find(name => name.toLowerCase() === p1);
                let p2Available = remainingNames.find(name => name.toLowerCase() === p2);

                if (hasP1 && p2Available) targetName = p2Available;
                if (hasP2 && p1Available) targetName = p1Available;
            }

            if (targetName) {
                return remainingNames.indexOf(targetName);
            }

            let validCandidates = remainingNames.map((n, i) => i);
            
            if (isLastSlot && teamSize >= 2) {
                validCandidates = validCandidates.filter(i => !isHalfOfAvailablePair(remainingNames[i]));
                if (validCandidates.length === 0) {
                    validCandidates = remainingNames.map((n, i) => i);
                }
            }
            
            return validCandidates[Math.floor(Math.random() * validCandidates.length)];
        }

        function drawWheel() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (remainingNames.length === 0) return;

            const sliceAngle = (2 * Math.PI) / remainingNames.length;

            for (let i = 0; i < remainingNames.length; i++) {
                const startAngle = currentAngle + i * sliceAngle;
                const endAngle = startAngle + sliceAngle;

                ctx.beginPath();
                ctx.moveTo(radius, radius);
                ctx.arc(radius, radius, radius, startAngle, endAngle);
                ctx.fillStyle = colors[i % colors.length];
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = "#0a1416";
                ctx.stroke();

                ctx.save();
                ctx.translate(radius, radius);
                ctx.rotate(startAngle + sliceAngle / 2);
                ctx.textAlign = "right";
                
                if (colors[i % colors.length] === "#d4af37" || colors[i % colors.length] === "#f9a825" || colors[i % colors.length] === "#c5a030") {
                    ctx.fillStyle = "#111111";
                } else {
                    ctx.fillStyle = "#ffffff";
                }
                
                ctx.font = "bold 22px sans-serif";
                
                if (remainingNames.length === 1) {
                    ctx.textAlign = "center";
                    ctx.fillText(remainingNames[i], 0, -radius/2);
                } else {
                    ctx.fillText(remainingNames[i], radius - 25, 8);
                }
                ctx.restore();
            }
            
            ctx.beginPath();
            ctx.arc(radius, radius, 65, 0, 2 * Math.PI);
            ctx.fillStyle = "#0a1416";
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = "#d4af37";
            ctx.stroke();
        }

        function easeOutCubic(t, b, c, d) {
            t /= d;
            t--;
            return c * (t * t * t + 1) + b;
        }

        function spin() {
            if (isSpinning || remainingNames.length === 0) return;
            isSpinning = true;
            
            document.getElementById("winner-text").innerText = "Losování...";
            document.getElementById("spin-btn").disabled = true;

            let targetIndex = determineWinnerIndex();
            
            const sliceAngle = (2 * Math.PI) / remainingNames.length;
            let baseEndAngle = (3 * Math.PI / 2) - (targetIndex + 0.5) * sliceAngle;
            
            let startAngle = currentAngle;
            let endAngle = baseEndAngle;
            
            let extraSpins = Math.floor(Math.random() * 3) + 4;
            while(endAngle <= startAngle + (extraSpins * 2 * Math.PI)) {
                endAngle += 2 * Math.PI;
            }

            const spinTimeTotal = Math.random() * 1000 + 3500; 
            let startTime = null;

            function rotate(timestamp) {
                if (!startTime) startTime = timestamp;
                let progress = timestamp - startTime;
                
                if (progress >= spinTimeTotal) {
                    currentAngle = endAngle % (2 * Math.PI);
                    isSpinning = false;
                    drawWheel();
                    processWinner(targetIndex);
                    return;
                }
                
                currentAngle = easeOutCubic(progress, startAngle, endAngle - startAngle, spinTimeTotal);
                drawWheel();
                requestAnimationFrame(rotate);
            }
            requestAnimationFrame(rotate);
        }

        function processWinner(index) {
            const winner = remainingNames[index];
            document.getElementById("winner-text").innerText = winner + "!";

            teams[currentTeamIndex].push(winner);
            remainingNames.splice(index, 1);

            if (teams[currentTeamIndex].length >= teamSize && remainingNames.length > 0) {
                teams.push([]); 
                currentTeamIndex++; 
            }

            renderTeamsUI();
            updateStatusText();

            if (remainingNames.length > 0) {
                drawWheel();
                document.getElementById("spin-btn").disabled = false;
            } else {
                document.getElementById("wheel-container").style.display = "none";
                document.getElementById("spin-actions").style.display = "none";
                document.getElementById("status-text").innerText = "Rozlosování je kompletní!";
                document.getElementById("go-to-game-btn").style.display = "block";
            }
        }

        function updateStatusText() {
            if (remainingNames.length > 0) {
                const currentTeamNumber = currentTeamIndex + 1;
                const currentMembers = teams[currentTeamIndex].length;
                document.getElementById("status-text").innerText = `Točíme pro: Tým ${currentTeamNumber} (${currentMembers}/${teamSize})`;
            }
        }

        function renderTeamsUI() {
            const container = document.getElementById("teams-display");
            container.innerHTML = ""; 

            teams.forEach((team, index) => {
                if (team.length === 0 && index !== 0) return;

                const card = document.createElement("div");
                card.className = "team-card";
                
                const title = document.createElement("h3");
                title.innerText = `Tým ${index + 1}`;
                card.appendChild(title);

                const list = document.createElement("ul");
                team.forEach(member => {
                    const li = document.createElement("li");
                    li.innerText = member;
                    list.appendChild(li);
                });
                
                card.appendChild(list);
                container.appendChild(card);
            });
        }

        // --- NÁVRAT DO HRY S VYLOSOVANÝMI TÝMY (LOCAL STORAGE) ---
        function goToGame() {
            localStorage.setItem('maximo_teams_ready', JSON.stringify(teams));
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
