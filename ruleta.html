<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Maximo smyko - Ruleta</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            background-image: url('vnitrekmaximo.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            
            color: #dddddd;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* Vzhled kontejneru sladěný s hlavní hrou */
        .container {
            background: #252525;
            padding: 30px;
            border-radius: 8px;
            text-align: center;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 1px solid #3d3d3d;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 28px;
            letter-spacing: 1px;
            color: #f7a800; /* Oranžová z hlavní hry */
            text-transform: uppercase;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 15px;
        }

        .primary-btn {
            background: #dfb331; /* Žlutá z hlavní hry */
            border: none;
            padding: 12px 30px;
            color: #222;
            font-size: 18px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            transition: opacity 0.2s;
        }
        
        .primary-btn:hover { opacity: 0.9; }

        .primary-btn:disabled {
            background: #555;
            color: #888;
            cursor: not-allowed;
            opacity: 1;
        }

        .secondary-btn {
            background: #444; /* Tmavá z hlavní hry */
            border: none;
            padding: 12px 25px;
            color: #fff;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            text-transform: uppercase;
            text-decoration: none;
        }

        .secondary-btn:hover { background: #555; }

        .wheel-wrapper {
            position: relative;
            margin: 0 auto 20px auto;
            width: 100%;
            max-width: 380px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            width: 100%;
            height: auto;
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            border: 6px solid #1c1c1c;
            background: #000;
        }

        #center-logo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 25%;  
            max-width: 80px;
            height: auto;
            z-index: 5;
            filter: drop-shadow(0 0 10px rgba(0,0,0,0.8));
            pointer-events: none;
        }

        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; 
            height: 0; 
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 35px solid #ffffff;
            z-index: 10;
            filter: drop-shadow(0 4px 5px rgba(0,0,0,0.6));
        }

        #status-text {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #f7a800;
        }

        #winner-text {
            height: 40px;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #teams-display {
            margin-top: 25px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }

        .team-card {
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 15px;
            min-width: 130px;
            flex: 1 1 40%;
            max-width: 180px;
            text-align: left;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        .team-card h3 {
            margin: 0 0 10px 0;
            color: #dfb331;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
            font-size: 16px;
            text-align: center;
        }

        .team-card ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .team-card li {
            margin-bottom: 6px;
            font-size: 15px;
            text-align: center;
            color: #eee;
        }

        @media (max-width: 500px) {
            body { padding: 10px; }
            .container { padding: 20px; }
            h2 { font-size: 24px; }
            #status-text { font-size: 18px; }
            #winner-text { font-size: 24px; margin-bottom: 15px; }
            .primary-btn { padding: 12px 20px; font-size: 16px; }
            .secondary-btn { padding: 12px 15px; font-size: 14px; }
            .team-card { min-width: 110px; padding: 10px; }
        }
    </style>
</head>
<body>

    <div class="container" id="roulette-screen" style="display: none;">
        <h2>Maximálně smyková ruleta</h2>
        <div id="status-text">Připravuji losování...</div>
        <div id="winner-text"></div>
        
        <div class="wheel-wrapper" id="wheel-container">
            <div class="pointer"></div>
            <img src="korunka.png" id="center-logo" alt="Maximo smyko">
            <canvas id="wheel" width="400" height="400"></canvas>
        </div>
        
        <div class="action-buttons">
            <a href="index.html" class="secondary-btn">Zpět do hry</a>
            <button class="primary-btn" id="spin-btn" onclick="spin()">ZATOČIT</button>
        </div>

        <div id="teams-display"></div>
    </div>

    <script>
        const canvas = document.getElementById("wheel");
        const ctx = canvas.getContext("2d");
        const radius = canvas.width / 2;
        
        let remainingNames = [];
        let teamSize = 2;
        let teams = [[]];
        let currentTeamIndex = 0;
        let currentAngle = 0;
        let isSpinning = false;
        
        // Barvy rulety upravené do tmavých tónů a oranžové z hlavní hry
        const colors = ["#2a2a2a", "#dfb331", "#1f1f1f", "#d9a128", "#111111", "#c5901b"];

        // --- AUTOMATICKÉ NAČTENÍ JMEN Z HLAVNÍ HRY ---
        window.onload = function() {
            const storedNames = sessionStorage.getItem('maximo_roulette_names');
            const storedSize = sessionStorage.getItem('maximo_roulette_size');
            
            if (storedNames) {
                remainingNames = JSON.parse(storedNames);
                teamSize = parseInt(storedSize) || 2;
                document.getElementById('roulette-screen').style.display = 'block';
                
                updateStatusText();
                renderTeamsUI();
                drawWheel();
            } else {
                // Pokud sem někdo zabloudí bez zadání jmen, pošleme ho zpět
                window.location.href = 'index.html';
            }
        };

        // --- ZVUKOVÝ SYSTÉM (SYNTETIZÁTOR) ---
        let audioCtx;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playClickSound() {
            if (!audioCtx) return;
            const bufferSize = audioCtx.sampleRate * 0.05;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 1000;
            const gainNode = audioCtx.createGain();
            
            gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.03);
            
            noise.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            noise.start();
        }

        // --- TAJNÁ LOGIKA PRO PÁROVÁNÍ ---
        function normalizeName(name) {
            return name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
        }

        const secretPairs = [
            ["vasa", "terka"],
            ["david", "eliska"]
        ];

        function isHalfOfAvailablePair(name) {
            let n = normalizeName(name);
            for (let pair of secretPairs) {
                let p1 = pair[0], p2 = pair[1];
                if (n === p1 && remainingNames.some(x => normalizeName(x) === p2)) return true;
                if (n === p2 && remainingNames.some(x => normalizeName(x) === p1)) return true;
            }
            return false;
        }

        function determineWinnerIndex() {
            let targetName = null;
            let currentTeam = teams[currentTeamIndex];
            let isLastSlot = (currentTeam.length === teamSize - 1);

            for (let pair of secretPairs) {
                let p1 = pair[0], p2 = pair[1];
                let hasP1 = currentTeam.some(name => normalizeName(name) === p1);
                let hasP2 = currentTeam.some(name => normalizeName(name) === p2);
                let p1Available = remainingNames.find(name => normalizeName(name) === p1);
                let p2Available = remainingNames.find(name => normalizeName(name) === p2);

                if (hasP1 && p2Available) targetName = p2Available;
                if (hasP2 && p1Available) targetName = p1Available;
            }

            if (targetName) return remainingNames.indexOf(targetName);

            let validCandidates = remainingNames.map((n, i) => i);
            if (isLastSlot && teamSize >= 2) {
                validCandidates = validCandidates.filter(i => !isHalfOfAvailablePair(remainingNames[i]));
                if (validCandidates.length === 0) validCandidates = remainingNames.map((n, i) => i);
            }
            return validCandidates[Math.floor(Math.random() * validCandidates.length)];
        }

        function drawWheel() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (remainingNames.length === 0) return;

            const sliceAngle = (2 * Math.PI) / remainingNames.length;

            for (let i = 0; i < remainingNames.length; i++) {
                const startAngle = currentAngle + i * sliceAngle;
                const endAngle = startAngle + sliceAngle;

                ctx.beginPath();
                ctx.moveTo(radius, radius);
                ctx.arc(radius, radius, radius, startAngle, endAngle);
                ctx.fillStyle = colors[i % colors.length];
                ctx.fill();
                ctx.lineWidth = 1;
                ctx.strokeStyle = "#000";
                ctx.stroke();

                ctx.save();
                ctx.translate(radius, radius);
                ctx.rotate(startAngle + sliceAngle / 2);
                ctx.textAlign = "right";
                
                if (colors[i % colors.length].includes("dfb") || colors[i % colors.length].includes("c59") || colors[i % colors.length].includes("d9a")) {
                    ctx.fillStyle = "#111111";
                } else {
                    ctx.fillStyle = "#ffffff";
                }
                
                ctx.font = "bold 22px sans-serif";
                
                if (remainingNames.length === 1) {
                    ctx.textAlign = "center";
                    ctx.fillText(remainingNames[i], 0, -radius/2);
                } else {
                    ctx.fillText(remainingNames[i], radius - 25, 8);
                }
                ctx.restore();
            }
            
            ctx.beginPath();
            ctx.arc(radius, radius, 65, 0, 2 * Math.PI);
            ctx.fillStyle = "#1a1a1a";
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = "#dfb331";
            ctx.stroke();
        }

        function easeOutCubic(t, b, c, d) {
            t /= d; t--; return c * (t * t * t + 1) + b;
        }

        function spin() {
            if (isSpinning || remainingNames.length === 0) return;
            isSpinning = true;
            
            initAudio(); 
            document.getElementById("winner-text").innerText = "Losování...";
            document.getElementById("spin-btn").disabled = true;

            let targetIndex = determineWinnerIndex();
            
            const sliceAngle = (2 * Math.PI) / remainingNames.length;
            let baseEndAngle = (3 * Math.PI / 2) - (targetIndex + 0.5) * sliceAngle;
            
            let startAngle = currentAngle;
            let endAngle = baseEndAngle;
            let extraSpins = Math.floor(Math.random() * 3) + 4;
            while(endAngle <= startAngle + (extraSpins * 2 * Math.PI)) endAngle += 2 * Math.PI;

            const spinTimeTotal = Math.random() * 1000 + 3500; 
            let startTime = null;
            let lastSliceIndex = -1; 

            function rotate(timestamp) {
                if (!startTime) startTime = timestamp;
                let progress = timestamp - startTime;
                
                if (progress >= spinTimeTotal) {
                    currentAngle = endAngle % (2 * Math.PI);
                    isSpinning = false;
                    drawWheel();
                    processWinner(targetIndex);
                    return;
                }
                
                currentAngle = easeOutCubic(progress, startAngle, endAngle - startAngle, spinTimeTotal);
                
                let currentDeg = currentAngle % (2 * Math.PI);
                let pointerAngle = (3 * Math.PI / 2) - currentDeg;
                if (pointerAngle < 0) pointerAngle += 2 * Math.PI;
                let currentSliceIndex = Math.floor(pointerAngle / sliceAngle);
                
                if (lastSliceIndex !== -1 && currentSliceIndex !== lastSliceIndex) playClickSound();
                lastSliceIndex = currentSliceIndex;
                
                drawWheel();
                requestAnimationFrame(rotate);
            }
            requestAnimationFrame(rotate);
        }

        function processWinner(index) {
            const winner = remainingNames[index];
            document.getElementById("winner-text").innerText = winner + "!";

            teams[currentTeamIndex].push(winner);
            remainingNames.splice(index, 1);

            if (teams[currentTeamIndex].length >= teamSize && remainingNames.length > 0) {
                teams.push([]); 
                currentTeamIndex++; 
            }

            renderTeamsUI();
            updateStatusText();

            if (remainingNames.length > 0) {
                drawWheel();
                document.getElementById("spin-btn").disabled = false;
            } else {
                document.getElementById("wheel-container").style.display = "none";
                document.getElementById("status-text").innerText = "Rozlosování dokončeno!";
            }
        }

        function updateStatusText() {
            if (remainingNames.length > 0) {
                const currentTeamNumber = currentTeamIndex + 1;
                const currentMembers = teams[currentTeamIndex].length;
                document.getElementById("status-text").innerText = `Točíme pro: Tým ${currentTeamNumber} (${currentMembers}/${teamSize})`;
            }
        }

        function renderTeamsUI() {
            const container = document.getElementById("teams-display");
            container.innerHTML = ""; 

            teams.forEach((team, index) => {
                if (team.length === 0 && index !== 0) return;

                const card = document.createElement("div");
                card.className = "team-card";
                
                const title = document.createElement("h3");
                title.innerText = `Tým ${index + 1}`;
                card.appendChild(title);

                const list = document.createElement("ul");
                team.forEach(member => {
                    const li = document.createElement("li");
                    li.innerText = member;
                    list.appendChild(li);
                });
                
                card.appendChild(list);
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
